[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handle-finder"
version = "0.1.0"
description = "Find short Instagram usernames (3-4 characters) that look available to register."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
handle-finder = "handle_finder.cli:main"

[tool.setuptools]
packages = ["handle_finder"]

[tool.setuptools.package-data]
handle_finder = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Optional no-op hooks on ConfirmChecker are intentional.
ignore = ["B027"]

[tool.ruff.lint.isort]
known-first-party = ["handle_finder", "conftest"]
